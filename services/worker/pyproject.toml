[project]
name = "worker"
version = "0.1.0"
description = "Background worker — outbox processing, Notion ingestion, analytics jobs"
requires-python = ">=3.12"
dependencies = [
    "arq>=0.26.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "boto3>=1.34.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-community>=0.2.0",
    "tenacity>=8.3.0",
    "cryptography>=42.0.0",
    "supabase>=2.4.0",
    "notion-client>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
