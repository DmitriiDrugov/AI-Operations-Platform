[project]
name = "ai-core"
version = "0.1.0"
description = "AI Core Service — LangChain agents, RAG pipelines, Claude integration"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Anthropic / AI
    "anthropic>=0.28.0",
    "langchain>=0.2.0",
    "langchain-anthropic>=0.1.0",
    "langchain-openai>=0.1.0",       # for text-embedding-3-small
    "langchain-community>=0.2.0",
    "langchain-postgres>=0.0.6",     # pgvector integration
    # Database
    "supabase>=2.4.0",
    "asyncpg>=0.29.0",
    "sqlalchemy>=2.0.0",
    # AWS
    "boto3>=1.34.0",
    # Observability
    "structlog>=24.1.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-exporter-otlp>=1.24.0",
    "prometheus-fastapi-instrumentator>=6.1.0",
    # Utils
    "cryptography>=42.0.0",
    "tenacity>=8.3.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "ANN", "S", "B", "C4"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
